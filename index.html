<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getaway Shootout</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0a0a0f;
--panel: #12121a;
--border: #2a2a3a;
--red: #ff4444;
--blue: #44aaff;
--gold: #ffd700;
--text: #e8e8f0;
--muted: #666680;
}

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
color: var(–text);
font-family: ‘Barlow Condensed’, sans-serif;
min-height: 100vh;
overflow-x: hidden;
}

body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
linear-gradient(rgba(255,68,68,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(68,170,255,0.03) 1px, transparent 1px);
background-size: 50px 50px;
pointer-events: none;
z-index: 0;
}

header {
position: relative;
z-index: 10;
display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 32px;
border-bottom: 1px solid var(–border);
background: rgba(10,10,15,0.95);
backdrop-filter: blur(10px);
}

.logo {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 28px;
letter-spacing: 4px;
background: linear-gradient(90deg, var(–red), var(–gold), var(–blue));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.header-tag {
font-family: ‘Share Tech Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 3px;
text-transform: uppercase;
}

.badge {
font-family: ‘Barlow Condensed’, sans-serif;
font-weight: 700;
font-size: 12px;
letter-spacing: 2px;
text-transform: uppercase;
background: var(–red);
color: white;
padding: 4px 12px;
clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
}

main {
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 24px 16px;
gap: 16px;
}

.controls-bar {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
width: 100%;
max-width: 960px;
}

.ctrl {
background: var(–panel);
border: 1px solid var(–border);
padding: 10px 16px;
display: flex;
align-items: center;
gap: 12px;
}

.ctrl-label {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 16px;
letter-spacing: 2px;
white-space: nowrap;
}

.ctrl:first-child .ctrl-label { color: var(–red); }
.ctrl:last-child .ctrl-label { color: var(–blue); }

.ctrl-keys {
font-family: ‘Share Tech Mono’, monospace;
font-size: 12px;
color: var(–muted);
}

kbd {
display: inline-block;
background: rgba(255,255,255,0.08);
border: 1px solid rgba(255,255,255,0.15);
padding: 1px 6px;
font-family: ‘Share Tech Mono’, monospace;
font-size: 11px;
color: var(–gold);
margin: 0 1px;
}

.game-frame-wrap {
width: 100%;
max-width: 960px;
border: 2px solid var(–border);
position: relative;
background: #000;
box-shadow: 0 0 60px rgba(255,68,68,0.1), 0 0 60px rgba(68,170,255,0.1);
}

.game-frame-wrap::before {
content: ‘’;
position: absolute;
top: -2px; bottom: -2px;
left: -2px;
width: 2px;
background: linear-gradient(180deg, var(–red), transparent);
z-index: 1;
}

iframe {
display: block;
width: 100%;
height: 600px;
border: none;
}

.bottom-bar {
width: 100%;
max-width: 960px;
display: flex;
justify-content: space-between;
align-items: center;
padding: 10px 0;
border-top: 1px solid var(–border);
font-family: ‘Share Tech Mono’, monospace;
font-size: 11px;
color: var(–muted);
letter-spacing: 2px;
}

.open-link {
color: var(–gold);
text-decoration: none;
letter-spacing: 2px;
font-size: 11px;
transition: color 0.2s;
}
.open-link:hover { color: white; }

@media (max-width: 600px) {
header { padding: 12px 16px; }
.header-tag { display: none; }
.controls-bar { grid-template-columns: 1fr; }
iframe { height: 400px; }
}
</style>

</head>
<body>

<header>
<div class="logo">GETAWAY SHOOTOUT</div>
<div class="header-tag">// 2-PLAYER LOCAL BATTLE //</div>
<div class="badge">🔴 VS 🔵</div>
</header>

<main>
<div class="controls-bar">
<div class="ctrl">
<div class="ctrl-label">🔴 Player 1</div>
<div class="ctrl-keys">
Move: <kbd>W</kbd><kbd>E</kbd> &nbsp; Power-up: <kbd>R</kbd>
</div>
</div>
<div class="ctrl">
<div class="ctrl-label">🔵 Player 2</div>
<div class="ctrl-keys">
Move: <kbd>I</kbd><kbd>O</kbd> &nbsp; Power-up: <kbd>P</kbd>
</div>
</div>
</div>

<div class="game-frame-wrap">
<iframe
src="https://getawayshootoutonline.github.io/"
width="800"
height="600"
frameborder="0"
allowfullscreen
title="Getaway Shootout">
</iframe>
</div>

<div class="bottom-bar">
<span>// CLICK INSIDE THE GAME FIRST TO ENABLE KEYBOARD INPUT //</span>
<a class="open-link" href="https://getawayshootoutonline.github.io/" target="_blank">↗ OPEN FULL SITE</a>
</div>
</main>

</body>
</html>
